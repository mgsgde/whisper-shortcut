name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Offline unit tests + unsigned compile of both app schemes. No secrets, no .env,
# no live provider calls. Tests already compile the App Store scheme; the extra
# compile job is what catches `#if APP_STORE` drift in the direct/GitHub build.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hermetic-tests:
    name: Hermetic tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-home-${{ runner.os }}-${{ hashFiles('WhisperShortcut.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-home-${{ runner.os }}-

      - name: Run hermetic tests
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/TestResults.xcresult
        run: bash scripts/run-tests.sh --hermetic

      # A test-host crash is invisible in the console: xcodebuild prints every test as passing,
      # then names some unrelated test under "Failing tests:" — it lists the last test that
      # *completed*, not the one that was running when the process died. The backtrace only
      # exists in the crash report, so collect it rather than guessing from the log.
      - name: Show crash reports
        if: failure()
        run: |
          shopt -s nullglob
          reports=("$HOME"/Library/Logs/DiagnosticReports/*.ips "$HOME"/Library/Logs/DiagnosticReports/*.crash)
          if [[ ${#reports[@]} -eq 0 ]]; then
            echo "No crash reports in ~/Library/Logs/DiagnosticReports."
            exit 0
          fi
          for f in "${reports[@]}"; do
            echo "::group::$(basename "$f")"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
          if-no-files-found: warn

  compile-schemes:
    name: Compile ${{ matrix.scheme }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scheme: [WhisperShortcut, WhisperShortcut-AppStore]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-home-${{ runner.os }}-${{ hashFiles('WhisperShortcut.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-home-${{ runner.os }}-

      - name: Compile ${{ matrix.scheme }} (unsigned Debug)
        run: |
          xcodebuild build \
            -project WhisperShortcut.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.scheme }}" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=
