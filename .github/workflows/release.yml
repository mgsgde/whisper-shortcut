name: Build and Release

on:
  push:
    tags:
      - "v*"
    # A cache saved on a tag is invisible to the next tag, so main warms it and
    # tag builds only restore. Path filters are not applied to tag pushes, so
    # every v* tag still triggers.
    branches: [main]
    paths:
      - WhisperShortcut.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - .github/workflows/release.yml
  # Dependencies change rarely; a daily warm keeps the cache from expiring
  # between those pushes so the next tag is not a cold compile.
  schedule:
    - cron: "17 4 * * *"
  # Re-drive a tag that already exists. Six tags (v8.06..v8.11) failed to publish
  # and the only way back was `gh run rerun`, which needs the old run to still be
  # around. This does not need one.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to (re-)release, e.g. v8.11. Leave empty with warm_cache_only."
        required: false
        type: string
      # A warm fills the cache without cutting a release; a dry run exercises
      # signing and notarization without publishing.
      warm_cache_only:
        description: "Only build to fill the compilation cache; no export, notarization or release"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Run the whole pipeline but skip publishing (no Decide draft state, no Create Release)"
        required: false
        default: false
        type: boolean
      draft:
        description: "Keep the release a draft (build, install the DMG, test, then publish by hand)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

# WARM_ONLY is the string "true" or "false": a schedule, a branch push, or
# warm_cache_only only fills the cache. Tag pushes stay full releases.
env:
  WARM_ONLY: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref_type == 'branch') || inputs.warm_cache_only == true }}
  # CAS and the cloned packages are what the cache action persists. Derived data
  # is per job and stays out of the cache.
  CAS_PATH: /Users/runner/xcode-cas
  SPM_PATH: /Users/runner/spm-packages
  DERIVED_DATA_PATH: /Users/runner/release-dd

jobs:
  hermetic-tests:
    name: Hermetic tests
    runs-on: macos-latest
    timeout-minutes: 45
    # A warm run never publishes, so the offline gate would only spend CI minutes.
    if: ${{ !(github.event_name == 'schedule' || (github.event_name == 'push' && github.ref_type == 'branch') || inputs.warm_cache_only == true) }}
    # No secrets: the hermetic subset is offline and must stay that way.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run hermetic tests
        run: bash scripts/run-tests.sh --hermetic

  build-and-release:
    name: Build, Sign, Notarize, and Release
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # A manual release needs a tag. A cache warm does not.
      - name: Check inputs
        run: if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$WARM_ONLY" != "true" ] && [ -z "${{ inputs.tag }}" ]; then echo "::error::tag is required unless warm_cache_only is set"; exit 1; fi

      # The key must change with the compiler and Package.resolved, or a restore
      # would mix incompatible objects. The prefix is the fallback for an older entry.
      - name: Build cache key
        id: cache_key
        # v2: entries written by a single cold pass (v1) miss on FluidAudio, see Build and archive.
        run: |
          XCODE=$(xcodebuild -version | tr '\n' ' ' | sed -E 's/[^A-Za-z0-9.]+/-/g; s/-+$//')
          echo "prefix=xcode-cas-v2-${{ runner.os }}-${{ runner.arch }}-$XCODE-" >> "$GITHUB_OUTPUT"
          echo "key=xcode-cas-v2-${{ runner.os }}-${{ runner.arch }}-$XCODE-${{ hashFiles('WhisperShortcut.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}" >> "$GITHUB_OUTPUT"
          echo "key: $(tail -1 "$GITHUB_OUTPUT")"

      # An exact hit means this warm has nothing to compile. lookup-only avoids
      # downloading a cache the job will not use.
      - name: Check warm cache
        id: warm_lookup
        if: env.WARM_ONLY == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CAS_PATH }}
            ${{ env.SPM_PATH }}
          key: ${{ steps.cache_key.outputs.key }}
          lookup-only: true

      # Content-addressed, so an older entry is safe; stale entries just miss.
      - name: Restore build cache
        id: cache_restore
        if: env.WARM_ONLY != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CAS_PATH }}
            ${{ env.SPM_PATH }}
          key: ${{ steps.cache_key.outputs.key }}
          restore-keys: ${{ steps.cache_key.outputs.prefix }}

      # A warm run that already found the cache has nothing to compile.
      - name: Import signing certificate
        if: steps.warm_lookup.outputs.cache-hit != 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-keychain-password' }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Make keychain default for codesign
          security default-keychain -s $KEYCHAIN_PATH

          # Find and store the certificate identity for later use
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "❌ Error: Developer ID Application certificate not found after import"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "CERT_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          echo "Found certificate identity: $IDENTITY"

      - name: Install provisioning profile
        if: steps.warm_lookup.outputs.cache-hit != 'true'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.provisionprofile

          # Decode provisioning profile
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PP_PATH

          # Extract UUID from the profile
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i $PP_PATH)")
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< "$(security cms -D -i $PP_PATH)")

          # Install to the standard location
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.provisionprofile

          echo "Installed provisioning profile: $PP_NAME ($PP_UUID)"

      # Write the content-addressed cache into CAS_PATH so the next tag restores
      # it instead of compiling cold. The hit/miss line shows whether it did.
      - name: Build and archive
        if: steps.warm_lookup.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          archive() {
            xcodebuild archive \
              -disableAutomaticPackageResolution \
              -clonedSourcePackagesDirPath "$SPM_PATH" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -project WhisperShortcut.xcodeproj \
              -scheme WhisperShortcut \
              -configuration Release \
              -archivePath $RUNNER_TEMP/WhisperShortcut.xcarchive \
              -skipPackagePluginValidation \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Developer ID Application" \
              DEVELOPMENT_TEAM=${{ secrets.TEAM_ID }} \
              COMPILATION_CACHE_ENABLE_CACHING=YES \
              COMPILATION_CACHE_CAS_PATH="$CAS_PATH" \
              | tee "$RUNNER_TEMP/archive$1.log"
          }
          archive 1
          echo "Pass 1: Compilation cache: $(grep -c 'Cache hit' "$RUNNER_TEMP/archive1.log" || true) hits, $(grep -c 'Cache miss' "$RUNNER_TEMP/archive1.log" || true) misses"
          # A single cold pass leaves FluidAudio (and the tiny LuxTtsG2pResources it imports) under keys
          # that the next build does not look up, so every release recompiled FluidAudio (~5 min on CI).
          # Measured 2026-11-04 on the FluidAudio package alone: pass 2 missed exactly those two targets,
          # pass 3 hit all 168 jobs. A second pass on a fresh DerivedData writes the keys releases use.
          if [ "$WARM_ONLY" = "true" ]; then
            rm -rf "$DERIVED_DATA_PATH" "$RUNNER_TEMP/WhisperShortcut.xcarchive"
            archive 2
            echo "Pass 2: Compilation cache: $(grep -c 'Cache hit' "$RUNNER_TEMP/archive2.log" || true) hits, $(grep -c 'Cache miss' "$RUNNER_TEMP/archive2.log" || true) misses"
          fi

      # A dry run keeps Xcode's per-task build log so the build's critical path can be read
      # with xclogparser instead of guessed from buffered console timestamps.
      - name: Upload build log
        if: always() && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: xcactivitylog
          path: ${{ env.DERIVED_DATA_PATH }}/Logs/Build/*.xcactivitylog
          retention-days: 7
          if-no-files-found: warn

      # Only the default branch saves (schedule/push/dispatch on main); tag runs only
      # restore, since a cache saved under a tag ref is invisible to the next tag.
      - name: Save build cache
        if: env.WARM_ONLY == 'true' && steps.warm_lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CAS_PATH }}
            ${{ env.SPM_PATH }}
          key: ${{ steps.cache_key.outputs.key }}

      # Warm runs stop once the cache is saved.
      - name: Export archive
        if: env.WARM_ONLY != 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/WhisperShortcut.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist exportOptions-release.plist

      - name: Create DMG
        if: env.WARM_ONLY != 'true'
        run: |
          APP_PATH="$RUNNER_TEMP/export/WhisperShortcut.app"
          DMG_PATH="$RUNNER_TEMP/WhisperShortcut.dmg"
          VOLUME_NAME="WhisperShortcut"

          # Create a temporary directory for DMG contents
          DMG_TEMP="$RUNNER_TEMP/dmg_temp"
          mkdir -p "$DMG_TEMP"

          # Copy app to DMG directory
          cp -R "$APP_PATH" "$DMG_TEMP/"

          # Create a link to Applications directory
          ln -s /Applications "$DMG_TEMP/Applications"

          # Create DMG
          hdiutil create -volname "$VOLUME_NAME" \
            -srcfolder "$DMG_TEMP" \
            -ov -format UDZO \
            "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> $GITHUB_ENV

      - name: Sign DMG
        if: env.WARM_ONLY != 'true'
        run: |
          # Unlock the keychain (needed for codesign)
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Sign the DMG with the imported certificate identity
          codesign --force --verify --verbose --sign "$CERT_IDENTITY" --keychain "$KEYCHAIN_PATH" "$DMG_PATH"

          # Verify DMG signature
          codesign --verify --verbose "$DMG_PATH" || {
            echo "❌ Error: DMG signature verification failed"
            codesign -dvv "$DMG_PATH"
            exit 1
          }

          echo "✅ DMG signed successfully"

      - name: Notarize app
        if: env.WARM_ONLY != 'true'
        env:
          NOTARY_USERNAME: ${{ secrets.NOTARY_USERNAME }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          CREDS=(--apple-id "$NOTARY_USERNAME" --password "$NOTARY_PASSWORD" --team-id "$TEAM_ID")

          # Submit and wait as two steps. `submit --wait` has no timeout of its own:
          # on 2026-09-04 (v8.10) Apple's notary service stalled and it hung for 45
          # minutes until the job's timeout-minutes killed it, so a finished, signed
          # DMG was never published. Waiting separately means a stalled service costs
          # one more wait, and an *invalid* submission fails immediately with its log.
          SUBMISSION_ID=$(xcrun notarytool submit "$DMG_PATH" "${CREDS[@]}" \
            --output-format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "Notarization submission: $SUBMISSION_ID"

          for attempt in 1 2 3; do
            if xcrun notarytool wait "$SUBMISSION_ID" "${CREDS[@]}" --timeout 20m; then
              echo "✅ Notarization accepted"
              exit 0
            fi

            STATUS=$(xcrun notarytool info "$SUBMISSION_ID" "${CREDS[@]}" \
              --output-format json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","Unknown"))')
            echo "Wait attempt $attempt ended with status: $STATUS"

            # Only a still-running submission is worth waiting on again. Invalid and
            # Rejected are verdicts, not delays — surface the reason and stop.
            if [ "$STATUS" != "In Progress" ]; then
              echo "❌ Notarization did not succeed (status: $STATUS). Notary log:"
              xcrun notarytool log "$SUBMISSION_ID" "${CREDS[@]}" || true
              exit 1
            fi
          done

          echo "❌ Notarization still In Progress after 60 minutes — giving up."
          echo "Re-run this workflow, or dispatch it with the same tag once Apple's notary service recovers."
          exit 1

      - name: Staple notarization ticket
        if: env.WARM_ONLY != 'true'
        run: |
          xcrun stapler staple "$DMG_PATH"

      - name: Verify notarization
        if: env.WARM_ONLY != 'true'
        run: |
          # Verify stapling
          xcrun stapler validate "$DMG_PATH"

          # Verify code signature
          codesign --verify --verbose "$DMG_PATH"

          # Verify Gatekeeper acceptance
          spctl -a -vvv -t install "$DMG_PATH"

      - name: Get version from tag
        id: get_version
        if: env.WARM_ONLY != 'true'
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (tag $TAG)"

      - name: Sign update and build appcast
        if: env.WARM_ONLY != 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set - appcast skipped, installed apps will not see this release as an update"
            exit 0
          fi

          TAG="${{ steps.get_version.outputs.tag }}"
          VERSION="${{ steps.get_version.outputs.version }}"

          SPARKLE_DIR="$RUNNER_TEMP/sparkle-tools"
          mkdir -p "$SPARKLE_DIR"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz" \
            -o "$RUNNER_TEMP/Sparkle-2.9.6.tar.xz"
          tar -xf "$RUNNER_TEMP/Sparkle-2.9.6.tar.xz" -C "$SPARKLE_DIR"

          SIGNATURE=$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$SPARKLE_DIR/bin/sign_update" --ed-key-file - -p "$DMG_PATH")
          LENGTH=$(stat -f%z "$DMG_PATH")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" WhisperShortcut/Info.plist)

          # One multi-item appcast at releases/latest/download/appcast.xml. The new item is
          # tagged sparkle:channel latest, so it reaches only Latest users until
          # scripts/promote-stable.sh removes that tag.
          # Fail rather than continue without it: a feed holding only the new (tagged) item
          # would leave Stable users with nothing and drop every promotion so far.
          if ! curl -fsL --retry 3 --retry-delay 5 \
              "https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml" \
              -o "$RUNNER_TEMP/previous-appcast.xml"; then
            echo "::error::Could not download the current appcast.xml - refusing to publish a feed without the earlier releases"
            exit 1
          fi
          echo "Previous appcast shortVersionString values:"
          grep shortVersionString "$RUNNER_TEMP/previous-appcast.xml" | head -3 || true

          python3 scripts/make-appcast.py \
            --version "$VERSION" \
            --build "$BUILD" \
            --url "https://github.com/${{ github.repository }}/releases/download/$TAG/WhisperShortcut.dmg" \
            --length "$LENGTH" \
            --signature "$SIGNATURE" \
            --notes .github/RELEASE_NOTES.md \
            --notes-de .github/RELEASE_NOTES.de.md \
            --min-system 15.5 \
            --previous "$RUNNER_TEMP/previous-appcast.xml" \
            --channel latest \
            --out "$RUNNER_TEMP/appcast.xml"

          echo "APPCAST_PATH=$RUNNER_TEMP/appcast.xml" >> $GITHUB_ENV

      - name: Prepare Release Notes
        id: release_notes
        if: env.WARM_ONLY != 'true'
        run: |
          if [ -f ".github/RELEASE_NOTES.md" ]; then
            echo "✅ Found RELEASE_NOTES.md, using it for release body"
            # Read the file and escape it properly for GitHub Actions
            RELEASE_BODY=$(cat .github/RELEASE_NOTES.md)
            # Use a delimiter that's unlikely to appear in the content
            {
              echo 'body<<EOF'
              echo "$RELEASE_BODY"
              echo EOF
            } >> $GITHUB_OUTPUT
          else
            echo "⚠️ RELEASE_NOTES.md not found, using default release body"
            {
              echo 'body<<EOF'
              echo "## WhisperShortcut ${{ steps.get_version.outputs.version }}"
              echo ""
              echo "### Installation"
              echo "1. Download the DMG file"
              echo "2. Open the DMG and drag WhisperShortcut to your Applications folder"
              echo "3. Open WhisperShortcut from Applications (you may need to allow it in System Settings > Privacy & Security)"
              echo EOF
            } >> $GITHUB_OUTPUT
          fi

      # Tests and build now run side by side (saves the ~6 min the tests took up front).
      # Nothing is published unless the tests passed: this step sits before "Create
      # Release", so a failing test job fails this job before any release is touched.
      - name: Wait for hermetic tests
        if: env.WARM_ONLY != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          deadline=$((SECONDS + 45 * 60))
          while true; do
            result=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.name == "Hermetic tests") | "\(.status) \(.conclusion)"') || result=""
            status=${result%% *}
            conclusion=${result#* }
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Hermetic tests passed."
                exit 0
              fi
              echo "::error::Hermetic tests finished with conclusion '$conclusion'; not publishing."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out after 45 min waiting for the Hermetic tests job (last state: '${result:-not found}')."
              exit 1
            fi
            echo "Hermetic tests not done yet (${result:-not found}); retrying in 20 s."
            sleep 20
          done

      # Decided right before publishing, not at the start: on 2026-10-19 v8.47 was set
      # back to draft by hand while this run was still building, and `draft: false`
      # published it again at the end. A release a human holds back stays held back.
      # dry_run stops here so nothing is published.
      - name: Decide draft state
        id: draft_state
        if: env.WARM_ONLY != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          RELEASE_AS_DRAFT: ${{ vars.RELEASE_AS_DRAFT }}
        run: |
          set -uo pipefail
          DRAFT=false
          if [ "$INPUT_DRAFT" = "true" ]; then
            DRAFT=true; echo "Draft requested via workflow_dispatch input"
          elif [ "$RELEASE_AS_DRAFT" = "true" ]; then
            DRAFT=true; echo "Draft requested via repo variable RELEASE_AS_DRAFT"
          else
            # The releases/tags endpoint hides drafts, so scan the list instead.
            if EXISTING=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
                  --jq ".[] | select(.tag_name == \"$TAG\") | .draft"); then
              if echo "$EXISTING" | grep -qx true; then
                DRAFT=true; echo "Release $TAG already exists as a draft - leaving it a draft"
              fi
            else
              # Fail closed: an unpublished release is recoverable, a wrongly published one is not.
              DRAFT=true; echo "::warning::Could not list releases - keeping $TAG a draft"
            fi
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "::notice::$TAG stays a draft. Publish with: gh release edit $TAG --draft=false --latest"
          fi
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: env.WARM_ONLY != 'true' && inputs.dry_run != true
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.APPCAST_PATH }}
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          # true: a new release is created as a draft, an existing draft is only
          # updated (assets replaced) and never finalized. An already published
          # release keeps its state either way.
          draft: ${{ steps.draft_state.outputs.draft == 'true' }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keychain and provisioning profile
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.provisionprofile || true
